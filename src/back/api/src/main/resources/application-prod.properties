# ─────────────────────────────────────────────────────────────────────────────
# Profile de PRODUÇÃO — todos os segredos vêm de variáveis de ambiente.
# Ativar com: SPRING_PROFILES_ACTIVE=prod   (ou "prod,seed" para popular a demo)
# ─────────────────────────────────────────────────────────────────────────────
spring.application.name=api
spring.output.ansi.enabled=NEVER

# Railway define a porta pública em $PORT
server.port=${PORT:8080}

# Banco — apontar para o MySQL gerenciado do Railway
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# desliga o console H2 em produção
spring.h2.console.enabled=false

# Segurança / JWT
security.jwt.secret=${SECURITY_JWT_SECRET}
security.jwt.expiration=${SECURITY_JWT_EXPIRATION:86400000}

# E-mail (Resend) — opcional; se a chave não for definida o envio é só ignorado
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# URLs públicas
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
